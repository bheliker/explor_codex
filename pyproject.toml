[project]
name = "explor-codex"
version = "0.1.0"
description = "A plain Flask-ready app template managed with uv."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1,<4",
]

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pytest>=8.4,<9",
    "ruff>=0.11,<0.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.13"
files = ["app", "tests"]
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
