[project]
name = "explor-codex"
version = "0.1.0"
description = "A plain Flask-ready app template managed with uv."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16,<2",
    "flask>=3.1,<4",
    "flask-login>=0.6,<0.7",
    "flask-migrate>=4.1,<5",
    "flask-sqlalchemy>=3.1,<4",
    "geoalchemy2>=0.18,<0.19",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<2.1",
]

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pytest>=8.4,<9",
    "ruff>=0.11,<0.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.13"
files = ["app", "tests"]
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["flask_login", "flask_migrate"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
