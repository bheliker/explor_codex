<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}explor_codex{% endblock %}</title>
  <style>
    :root {
      --bg: #f4efe7;
      --panel: rgba(255, 251, 245, 0.92);
      --panel-strong: #fffaf3;
      --ink: #1f1a17;
      --muted: #6f6258;
      --accent: #0f766e;
      --accent-soft: rgba(15, 118, 110, 0.12);
      --line: rgba(31, 26, 23, 0.12);
      --shadow: 0 18px 40px rgba(43, 28, 18, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(15, 118, 110, 0.12), transparent 28%),
        radial-gradient(circle at top right, rgba(180, 83, 9, 0.12), transparent 24%),
        linear-gradient(180deg, #f7f2ea 0%, var(--bg) 100%);
      min-height: 100vh;
    }

    a {
      color: inherit;
    }

    .shell {
      max-width: 1120px;
      margin: 0 auto;
      padding: 32px 20px 56px;
    }

    .hero {
      margin-bottom: 28px;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(250, 242, 230, 0.92));
      box-shadow: var(--shadow);
    }

    .eyebrow {
      margin: 0 0 10px;
      font-size: 0.82rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 20px;
      padding: 14px 18px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: var(--shadow);
    }

    .topbar-title {
      font-size: 0.95rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .topbar-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.85);
      text-decoration: none;
    }

    .flash-stack {
      display: grid;
      gap: 12px;
      margin-bottom: 18px;
    }

    .flash {
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      background: rgba(255, 255, 255, 0.88);
    }

    .flash-success {
      border-color: rgba(15, 118, 110, 0.25);
      background: rgba(15, 118, 110, 0.09);
      color: #0f5e58;
    }

    .flash-error {
      border-color: rgba(153, 27, 27, 0.2);
      background: rgba(153, 27, 27, 0.08);
      color: #7f1d1d;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.4rem);
      line-height: 0.95;
      font-weight: 600;
    }

    .hero p {
      max-width: 56rem;
      margin: 14px 0 0;
      font-size: 1.04rem;
      line-height: 1.55;
      color: var(--muted);
    }

    .grid {
      display: grid;
      gap: 20px;
      grid-template-columns: 320px minmax(0, 1fr);
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 22px;
      backdrop-filter: blur(10px);
    }

    .panel h2 {
      margin: 0 0 16px;
      font-size: 1.1rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .stack {
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 8px;
      font-size: 0.92rem;
      color: var(--muted);
    }

    input[type="search"],
    input[type="number"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fffdf8;
      color: var(--ink);
      font: inherit;
    }

    .checkboxes {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .checkboxes label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.7);
      color: var(--ink);
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      background: var(--accent);
      color: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.92rem;
    }

    .result-list {
      display: grid;
      gap: 14px;
    }

    .result-card {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel-strong);
    }

    .result-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: baseline;
      margin-bottom: 8px;
    }

    .result-title {
      margin: 0;
      font-size: 1.18rem;
    }

    .result-type {
      white-space: nowrap;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
    }

    .result-meta {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .tag {
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(31, 26, 23, 0.06);
      font-size: 0.86rem;
    }

    .empty {
      padding: 28px;
      border: 1px dashed var(--line);
      border-radius: 20px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.5);
      text-align: center;
    }

    @media (max-width: 860px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .checkboxes {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="topbar-title">explor_codex admin</div>
      <nav class="topbar-nav">
        <a class="nav-link" href="{{ url_for('core.admin_dashboard_route') }}">Dashboard</a>
        <a class="nav-link" href="{{ url_for('core.admin_search_route') }}">Search</a>
        <a class="nav-link" href="{{ url_for('core.admin_group_new_route') }}">New Group</a>
        <a class="nav-link" href="{{ url_for('core.admin_route_new_route') }}">New Route</a>
        <a class="nav-link" href="{{ url_for('core.admin_event_new_route') }}">New Event</a>
      </nav>
    </header>
    {% with flashes = get_flashed_messages(with_categories=true) %}
      {% if flashes %}
        <section class="flash-stack">
          {% for category, message in flashes %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        </section>
      {% endif %}
    {% endwith %}
    {% block body %}{% endblock %}
  </main>
</body>
</html>
