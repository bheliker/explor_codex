{% extends "base.html" %}

{% block title %}Set Password | explor_codex{% endblock %}

{% block body %}
  <section class="hero">
    <p class="eyebrow">Auth</p>
    <h1>Set a new password</h1>
    <p>Update the password for {{ user.display_name }}.</p>
  </section>

  <section class="grid">
    <aside class="panel stack">
      <h2>Context</h2>
      <div class="result-meta">
        <div>{{ user.email }}</div>
        <div><a href="{{ url_for('auth.login') }}">Back to login</a></div>
      </div>
    </aside>

    <form class="panel stack" method="post">
      <h2>Password</h2>
      <label>
        New password
        <input type="password" name="password" autocomplete="new-password">
      </label>
      <label>
        Confirm password
        <input type="password" name="password_confirm" autocomplete="new-password">
      </label>
      <button type="submit">Save Password</button>
    </form>
  </section>
{% endblock %}
